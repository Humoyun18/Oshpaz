<style>
/* Layout: one-column phone app. Screen 1 = product chips by category with a fixed "Ko'rish" bar. Screen 2 = dish cards with match meter. */
:root{
  --bg:#F2F7F6; --surface:#FFFFFF; --fg:#0F2629; --muted:#587074; --line:#D3E1DF;
  --accent:#0E7A84; --accent-fg:#FFFFFF; --accent-soft:#D8EFEC; --saffron:#E3A41D;
  --ok:#1C7448; --ok-soft:#DCF2E4; --warn:#9A4A06; --warn-soft:#FBE9D0;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1B1E; --surface:#112A2E; --fg:#E5F1EF; --muted:#93B0B2; --line:#21434A;
    --accent:#3CC0CA; --accent-fg:#04252A; --accent-soft:#143A40; --saffron:#EDB43A;
    --ok:#74D9A0; --ok-soft:#133826; --warn:#F3B472; --warn-soft:#3B2914; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1B1E; --surface:#112A2E; --fg:#E5F1EF; --muted:#93B0B2; --line:#21434A;
  --accent:#3CC0CA; --accent-fg:#04252A; --accent-soft:#143A40; --saffron:#EDB43A;
  --ok:#74D9A0; --ok-soft:#133826; --warn:#F3B472; --warn-soft:#3B2914; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.orn{height:10px;background:
  linear-gradient(135deg,var(--saffron) 25%,transparent 25%) -10px 0/20px 10px,
  linear-gradient(225deg,var(--saffron) 25%,transparent 25%) -10px 0/20px 10px,
  linear-gradient(315deg,var(--saffron) 25%,transparent 25%) 0 0/20px 10px,
  linear-gradient(45deg,var(--saffron) 25%,transparent 25%) 0 0/20px 10px;
  background-color:var(--accent)}
.hero .wrap{padding-top:20px;padding-bottom:14px}
h1{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1.05;margin:0 0 8px;letter-spacing:-.02em;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:46ch}
.lead b{color:var(--fg);font-weight:600}

/* sticky toolbar */
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tools .wrap{padding-top:10px;padding-bottom:10px;display:flex;flex-direction:column;gap:10px}
.search{width:100%;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px;min-width:0}
.search::placeholder{color:var(--muted)}
.nav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.nav::-webkit-scrollbar{display:none}
.navbtn{flex:none;border:0;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;padding:7px 12px;border-radius:999px}
:root[data-theme="dark"] .navbtn{color:var(--accent)}

main{padding-bottom:120px}
.sec{scroll-margin-top:130px;padding-top:20px}
.sec h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--display);font-size:1.15rem;font-weight:700;margin:0 0 10px;letter-spacing:-.01em}
.sec h2 small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:8px 13px;border:1px solid var(--line);background:var(--surface);border-radius:999px;transition:background .15s,border-color .15s}
.chip .em{font-size:17px;line-height:1}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.chip[hidden]{display:none!important}
.empty{color:var(--muted);padding:28px 0;text-align:center}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px}
.bar .info{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.bar .info b{font-family:var(--display);font-size:1.05rem}
.linkbtn{border:0;background:none;color:var(--muted);padding:2px 0;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.primary{border:0;background:var(--accent);color:var(--accent-fg);font-family:var(--display);font-weight:700;font-size:1.05rem;padding:14px 22px;border-radius:14px;min-height:50px;white-space:nowrap}
.primary:disabled{opacity:.4;cursor:not-allowed}

/* results */
.rtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.rtop .wrap{padding-top:10px;padding-bottom:10px;display:flex;flex-direction:column;gap:10px}
.back{align-self:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.rtitle{font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:-.02em;margin:0}
.mine{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.mine::-webkit-scrollbar{display:none}
.mine span{flex:none;font-size:12px;padding:4px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--accent-soft);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button span{font-variant-numeric:tabular-nums;margin-left:3px;opacity:.8}
.tags{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.tags::-webkit-scrollbar{display:none}
.tag{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.tag[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600;background:var(--accent-soft)}
.list{display:flex;flex-direction:column;gap:12px;padding-top:16px;padding-bottom:40px}
.dish{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.dhead{width:100%;border:0;background:none;text-align:left;padding:14px;display:flex;flex-direction:column;gap:10px}
.drow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dname{font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1.2;margin:0;min-width:0}
.pill{flex:none;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted)}
.meter{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:99px}
.fill.full{background:var(--ok)}
.chev{display:inline-block;transition:transform .2s;color:var(--muted)}
.dhead[aria-expanded="true"] .chev{transform:rotate(180deg)}
.dbody{padding:0 14px 16px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:14px}
.dbody h4{margin:14px 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ings{display:flex;flex-wrap:wrap;gap:6px}
.ing{font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid var(--line)}
.ing.have{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.ing.miss{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.ing.opt{border-style:dashed;color:var(--muted)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:10px;min-width:0}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:13px;font-weight:700;font-family:var(--display)}
.hint{color:var(--muted);font-size:13px;text-align:center;padding:4px 0 24px}
</style>

const ING={}, CAT_OF={};
CATS.forEach(([cn,items],ci)=>items.forEach(([id,n,e])=>{ING[id]={n,e};CAT_OF[id]=ci;}));
const DISHES=D.map((d,i)=>({id:i,name:d[0],min:d[1],tag:d[2],need:d[3].split(","),opt:d[4]?d[4].split(","):[],steps:d[5].split("~")}));
const norm=s=>s.toLowerCase().replace(/[ʻʼ’‘`]/g,"'");
const $=id=>document.getElementById(id);
let sel=new Set(), tab="all", tag="Hammasi", open=new Set();
try{const s=JSON.parse(localStorage.getItem("np-sel")||"[]");if(Array.isArray(s))s.forEach(x=>{if(ING[x])sel.add(x)});}catch(e){}
function save(){try{localStorage.setItem("np-sel",JSON.stringify([...sel]))}catch(e){}}

function evalDish(d){
  const have=[],miss=[];
  d.need.forEach(r=>{const a=r.split("|");const hit=a.find(x=>sel.has(x));hit?have.push(hit):miss.push(a)});
  return {d,have,miss,ratio:have.length/d.need.length};
}
function matches(){
  const out=[];
  DISHES.forEach(d=>{const m=evalDish(d);if(m.have.length>=1&&m.miss.length<=2&&m.ratio>=0.5)out.push(m)});
  out.sort((a,b)=>(a.miss.length-b.miss.length)||(b.d.need.length-a.d.need.length)||a.d.name.localeCompare(b.d.name));
  return out;
}

/* picker */
function buildPicker(){
  const nav=$("nav"), cats=$("cats");
  CATS.forEach(([cn,items],ci)=>{
    const b=document.createElement("button");b.type="button";b.className="navbtn";b.textContent=cn;
    b.onclick=()=>{const s=$("sec"+ci);if(s&&!s.hidden)s.scrollIntoView({block:"start"})};nav.appendChild(b);
    const sec=document.createElement("section");sec.className="sec";sec.id="sec"+ci;
    sec.innerHTML='<h2><span>'+cn+'</span><small id="sc'+ci+'"></small></h2><div class="chips" id="ch'+ci+'"></div>';
    cats.appendChild(sec);
    const box=sec.querySelector(".chips");
    items.forEach(([id,n,e])=>{
      const c=document.createElement("button");c.type="button";c.className="chip";c.dataset.id=id;c.dataset.n=norm(n);
      c.setAttribute("aria-pressed",sel.has(id));
      c.innerHTML='<span class="em" aria-hidden="true">'+e+'</span><span>'+n+'</span>';
      c.onclick=()=>{sel.has(id)?sel.delete(id):sel.add(id);c.setAttribute("aria-pressed",sel.has(id));save();refresh();};
      box.appendChild(c);
    });
  });
  const em=document.createElement("p");em.className="empty";em.id="noMatch";em.hidden=true;em.textContent="Bunday mahsulot topilmadi.";cats.appendChild(em);
}
function refresh(){
  const n=sel.size;
  CATS.forEach(([cn,items],ci)=>{
    const k=items.filter(x=>sel.has(x[0])).length;
    $("sc"+ci).textContent=k?k+" ta tanlandi":items.length+" ta";
  });
  const ms=matches();
  $("cnt").textContent=n?n+" ta mahsulot · "+ms.length+" ta ovqat":"Hech narsa tanlanmagan";
  $("clear").hidden=!n;
  $("go").disabled=!n;
}
$("q").addEventListener("input",e=>{
  const q=norm(e.target.value.trim());let any=false;
  CATS.forEach(([cn,items],ci)=>{
    let vis=0;
    document.querySelectorAll("#ch"+ci+" .chip").forEach(c=>{const show=!q||c.dataset.n.includes(q);c.hidden=!show;if(show)vis++});
    $("sec"+ci).hidden=!vis;if(vis)any=true;
  });
  $("noMatch").hidden=any;
});
$("clear").onclick=()=>{sel.clear();document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false"));save();refresh();};

/* results */
function show(v){
  $("pick").hidden=v!=="pick";$("results").hidden=v!=="results";
  window.scrollTo({top:0,behavior:"auto"});
}
$("go").onclick=()=>{tab="all";tag="Hammasi";renderResults();show("results");};
$("back").onclick=()=>show("pick");
function names(ids){return ids.map(i=>ING[i].n)}
function renderResults(){
  const all=matches();
  const ready=all.filter(m=>m.miss.length===0), near=all.filter(m=>m.miss.length>0);
  $("rtitle").textContent=ready.length?ready.length+" ta ovqatni hozir pishirasiz":"Hozircha to'liq ovqat yo'q";
  $("mine").innerHTML=[...sel].map(i=>"<span>"+ING[i].n+"</span>").join("");
  $("seg").innerHTML=[["all","Hammasi",all.length],["ready","Tayyor",ready.length],["near","Yaqin",near.length]]
    .map(([k,l,c])=>'<button type="button" data-k="'+k+'" aria-pressed="'+(tab===k)+'">'+l+'<span>'+c+'</span></button>').join("");
  $("seg").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.k;renderResults();});
  let pool=tab==="ready"?ready:tab==="near"?near:all;
  const tags=["Hammasi",...new Set(pool.map(m=>m.d.tag))];
  if(!tags.includes(tag))tag="Hammasi";
  $("tags").innerHTML=tags.map(t=>'<button type="button" class="tag" aria-pressed="'+(tag===t)+'">'+t+'</button>').join("");
  $("tags").querySelectorAll("button").forEach(b=>b.onclick=()=>{tag=b.textContent;renderResults();});
  if(tag!=="Hammasi")pool=pool.filter(m=>m.d.tag===tag);
  const list=$("list");
  if(!pool.length){
    list.innerHTML='<p class="empty">Bu bo\'limda ovqat yo\'q. Orqaga qaytib, yana mahsulot belgilang.</p>';return;
  }
  list.innerHTML=pool.map(card).join("")+'<p class="hint">Ko\'proq mahsulot belgilasangiz, ovqatlar soni ortadi.</p>';
  list.querySelectorAll(".dhead").forEach(h=>h.onclick=()=>{
    const id=+h.dataset.id,body=h.nextElementSibling,o=h.getAttribute("aria-expanded")==="true";
    h.setAttribute("aria-expanded",!o);body.hidden=o;o?open.delete(id):open.add(id);
  });
}
function card(m){
  const d=m.d,n=d.need.length,h=m.have.length,full=m.miss.length===0,isOpen=open.has(d.id);
  const pill=full?'<span class="pill ok">Hammasi bor</span>':'<span class="pill warn">'+m.miss.length+' ta yetmaydi</span>';
  const haveC=m.have.map(i=>'<span class="ing have">✓ '+ING[i].n+'</span>').join("");
  const missC=m.miss.map(a=>'<span class="ing miss">'+names(a).join(" yoki ")+'</span>').join("");
  const optC=d.opt.map(i=>'<span class="ing '+(sel.has(i)?"have":"opt")+'">'+(sel.has(i)?"✓ ":"")+ING[i].n+'</span>').join("");
  return '<article class="dish"><button type="button" class="dhead" data-id="'+d.id+'" aria-expanded="'+isOpen+'">'+
    '<div class="drow"><h3 class="dname">'+d.name+'</h3>'+pill+'</div>'+
    '<div class="meta"><span>'+d.min+' daqiqa</span><span>'+d.tag+'</span></div>'+
    '<div class="meter"><div class="track"><div class="fill'+(full?" full":"")+'" style="width:'+Math.round(h/n*100)+'%"></div></div><span>'+h+'/'+n+' mahsulot</span><span class="chev" aria-hidden="true">▾</span></div>'+
    '</button><div class="dbody"'+(isOpen?"":" hidden")+'>'+
    '<div><h4>Kerakli mahsulotlar</h4><div class="ings">'+haveC+missC+'</div></div>'+
    (optC?'<div><h4>Ixtiyoriy</h4><div class="ings">'+optC+'</div></div>':'')+
    '<div><h4>Tayyorlanishi</h4><ol class="steps">'+d.steps.map(s=>'<li><span>'+s+'</span></li>').join("")+'</ol></div>'+
    '</div></article>';
}

buildPicker();refresh();
</script>
